<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            text-align: center;
            padding: 0;
            margin: 0;
        }

        .sec {
            background-color: white;
            color: black;
            margin-left: 30px;
            margin-right: 30px;
            margin-top: 5rem;
            /* padding-left: 30px; */
            padding: 5rem 0;
            text-align: center;
            border-radius: 0.5rem;
        }

        .sec>h1:nth-child(1) {
            color: #6C6C6C;
        }

        .code-block {
            border: solid 0.4px #ccc;
            width: fit-content;
            margin: auto;
            margin-top: 1rem;
            padding: 0.2rem 1rem;
            border-radius: 8px;
            background-color: rgba(247, 246, 243, 1);
        }

        /* Button \/ */

        .btn {
            cursor: pointer;
            background-color: #2249F5;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            box-shadow: 0 3px 1rem 0 rgba(0, 0, 0, 0.25);
            margin: 1rem;
            margin-top: 3rem;
            font-size: 1rem;
            font-weight: 500;
        }

        body {
            background-color: #FAFAFA;
            font-family: 'Helvetica Neue';
            position: relative;
            padding: 0;
            margin: 0;
            height: 100vh;
        }

        a {
            color: gainsboro;
            text-decoration: underline;
        }

        a:visited {
            color: gainsboro;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
            height: 40px;
            display: flex;
            align-items: center;


        }

        footer>p {
            margin: 1rem auto;
        }
    </style>
</head>

<body>
    <div class="sec">
        <h1>Hey, Let's Verify your email</h1>
        </br>
        </br>
        </br>
        <p>Verification code</p>
        <h1 class="code-block">{{code}}</h1>
        <a href="https://latermeet.com/confirmation"><button class="btn">Enter Code</button></a>
        <p>Valid for next 5 min</p>
    </div>

    <footer>
        <p>
            Visit <a href="https://latermeet.com">latermeet.com</a> for more Information
        </p>
    </footer>
</body>

</html>
